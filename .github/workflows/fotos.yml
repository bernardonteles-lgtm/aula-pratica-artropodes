name: Fotografias (Wikimedia Commons)
on:
  workflow_dispatch:
  push:
    paths: ['fotos/lista.json', 'fotos/buscar.py']
permissions:
  contents: write
concurrency:
  group: fotos
  cancel-in-progress: true
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fotos/buscar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fotos
          git commit -m "Fotografias do Wikimedia Commons" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
